name: Publish Package to npmjs

on:
  release:
    types: [published]

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert package.json and README match release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: pnpm exec tsx scripts/sync-release-version.ts --assert "$TAG"
      - run: pnpm run typecheck
      - run: pnpm test
      # Trusted Publishing (OIDC): do not set NODE_AUTH_TOKEN / NPM_TOKEN
      # Version must already be bumped locally (pnpm version) and tagged before this Release.
      - run: pnpm publish --no-git-checks --access public
